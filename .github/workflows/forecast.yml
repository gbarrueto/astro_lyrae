name: Pronóstico de la noche

# Una corrida diaria a las 17:00 UTC — 13:00 en el complejo, con holgura antes
# del atardecer y ya con el run del modelo de las 12Z disponible. Los cron de
# GitHub pueden atrasarse hasta media hora, por eso no se programa al filo.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

# El pronóstico ya no se commitea: lo escribe el build, desde el mismo script.
# Este job solo pide ese build, así que no necesita tocar el repo.
permissions: {}

# Si una corrida se atrasa y se topa con la siguiente, que espere en vez de
# encolar dos despliegues por el mismo dato.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      # El hook se crea en Vercel (Settings → Git → Deploy Hooks) apuntando a
      # main, y viaja como secreto: quien tenga la URL puede disparar
      # despliegues.
      #
      # --retry cubre justo lo que falla acá: timeouts, cortes de conexión y
      # 5xx, que es lo que devolvió el hook la primera vez que corrió esto. No
      # se usa --retry-all-errors a propósito: un 401 o un 404 significan
      # secreto vencido o hook borrado, y reintentar eso solo tapa el aviso.
      #
      # --fail-with-body en vez de --fail para que el cuerpo de la respuesta
      # quede en el log; con --fail curl lo descarta y solo queda el código,
      # que no alcanza para saber si el problema es de Vercel o del secreto.
      - name: Pedirle a Vercel un despliegue con el pronóstico del día
        run: >-
          curl --request POST "$HOOK"
          --fail-with-body --silent --show-error
          --retry 3 --retry-delay 10 --max-time 30
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
